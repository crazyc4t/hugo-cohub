{{ $address := .Site.Params.address}}
<section class="contact" id="contact">
  <div class="container-fluid">
    <div class="row no-gutters">
      <div class="col-lg-6">
        <div>
          <iframe
            src="https://www.google.com/maps?q={{ $address.address | urlquery }}&output=embed"
            width="100%"
            height="500px"
            style="border: 0"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="contact-aria">
          <h2 style="color: #fff;">Our office</h3>
          <h3>{{ $address.address | safeHTML }}</h3>
          <ul>
            {{ with $address.email }}
            <li>
              <i class="ti-email" style="color: #fff;"></i>&nbsp;<a href="mailto:{{ . }}">{{ . }}</a>
            </li>
            {{ end }} {{ with $address.phone }}
            <li>
              <i class="ti-mobile" style="color: #fff;"></i>&nbsp;<a href="tel:{{ . }}">{{ . }}</a>
            </li>
            {{ end }}
          </ul>
          <p>{{ $address.openingDesc }}</p>
          <p>{{ $address.openingHours }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
